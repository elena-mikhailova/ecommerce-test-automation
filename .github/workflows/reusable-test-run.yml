name: Reusable Test Run

on:
  workflow_call:
    inputs:
      groups:
        description: JUnit test group to run
        required: true
        type: string

      exclude_quarantine:
        description: Exclude quarantined tests
        required: false
        default: true
        type: boolean

      allow_failure:
        description: Allow test failures without failing the job
        required: false
        default: false
        type: boolean

      notify_slack:
        description: Send test results to Slack
        required: false
        default: false
        type: boolean

    secrets:
      slack_webhook_url:
        description: Slack incoming webhook URL
        required: false
jobs:
  tests:
    name: ${{ inputs.groups }} tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests without quarantine
        if: ${{ inputs.exclude_quarantine == true }}
        continue-on-error: ${{ inputs.allow_failure }}
        run: >
          ./mvnw clean test
          -Dgroups=${{ inputs.groups }}
          -DexcludedGroups=quarantine
          -Dselenide.headless=true

      - name: Run tests
        if: ${{ inputs.exclude_quarantine == false }}
        continue-on-error: ${{ inputs.allow_failure }}
        run: >
          ./mvnw clean test
          -Dgroups=${{ inputs.groups }}
          -Dselenide.headless=true

      - name: Publish JUnit test report
        id: junit-report
        if: success() || failure()
        continue-on-error: ${{ inputs.allow_failure }}
        uses: step-security/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: '${{ inputs.groups }} Test Report'
          detailed_summary: true
          include_passed: false
          fail_on_parse_error: true
          require_tests: true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ inputs.groups }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-failure-artifacts-${{ inputs.groups }}
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ inputs.groups }}
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Allure report
        if: always()
        run: ./mvnw allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ inputs.groups }}
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Slack
        if: ${{ always() && inputs.notify_slack }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ steps.junit-report.outputs.failed != '0' && '❌' || '✅' }} ${{ inputs.groups }} tests: ${{ steps.junit-report.outputs.failed != '0' && 'FAILED' || 'PASSED' }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*${{ inputs.groups }} tests* — ${{ steps.junit-report.outputs.failed != '0' && '❌ FAILED' || '✅ PASSED' }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Passed:*\n${{ steps.junit-report.outputs.passed }}"
                  - type: "mrkdwn"
                    text: "*Failed:*\n${{ steps.junit-report.outputs.failed }}"
                  - type: "mrkdwn"
                    text: "*Skipped:*\n${{ steps.junit-report.outputs.skipped }}"
                  - type: "mrkdwn"
                    text: "*Total:*\n${{ steps.junit-report.outputs.total }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Non-blocking:* ${{ inputs.allow_failure }}"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "Open GitHub Actions"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"